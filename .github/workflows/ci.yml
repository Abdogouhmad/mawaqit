name: ci

# Fast feedback on every pull request and every branch push, `main` included.
# The release workflow (.github/workflows/release.yml) owns publishing; this
# workflow never publishes anything, it only verifies the tree — so a change
# that lands on `main` (via merge or a direct push) is still checked.
on:
  pull_request:
  push:
  workflow_dispatch:

# One run per ref: a new push cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  # Formatting + static analysis. Fails on any analyzer info/warning so the
  # stricter lint set in analysis_options.yaml stays at zero.
  analyze:
    name: format & analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      # The Glance/Dart widget output is checked in so the release build does not
      # need the generator, which means it can silently drift from the DSL.
      # Regenerate here and fail on any diff; never hand-edit generated Kotlin.
      - name: Verify generated home widget
        run: |
          dart run home_widget_cli:home_widget generate -i lib/src/home_widget
          git diff --exit-code -- \
            lib/src/home_widget \
            android/app/src/main/kotlin/com/freesoftware/mawaqit \
            android/app/src/main/res

  # Unit + widget tests.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify localization parity
        run: flutter test test/l10n_parity_test.dart

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  # Prove the Android toolchain still assembles the app. Debug keystore, so no
  # release secrets are required.
  build-android:
    name: build (android debug)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug
