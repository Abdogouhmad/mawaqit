# This machine has 7.6 GiB RAM — the old -Xmx8G heap guaranteed the daemon
# would be OOM-killed mid-build. Budgeted to fit: 2G heap + 768m metaspace.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
