name: mawaqit
description: "Mawaqit — a calm, focused prayer-times app with adhan reminders."
publish_to: "none"

# Sole source of truth for the release version. Android's versionCode is derived
# from it as major*10000 + minor*100 + patch by build.sh, which is also what the
# OTA manifest and the release tags use, so a bump here is the only bump needed.
version: 0.10.0

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  # Pulls in the localizations for every Material/Cupertino/Widgets string, so
  # the app's own translated strings can share one locale negotiation with the
  # built-in Material ones.
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.4.3
  adhan_dart: ^2.0.1
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_local_notifications: ^22.3.1
  flutter_local_notifications_linux: ^8.0.1
  workmanager: ^0.10.10
  shared_preferences: ^2.5.5
  # Pinned by flutter_localizations; also used directly for locale-aware
  # DateFormat (clock, Gregorian and Hijri dates).
  intl: ^0.20.3
  hijri: ^3.0.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  audioplayers: ^6.8.1
  http: ^1.6.0
  ota_update: ^7.1.0
  package_info_plus: ^10.2.1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint set activated in analysis_options.yaml.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  home_widget_generator: ^0.2.0
  home_widget_cli: ^0.2.0

flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations*.dart from the ARB files in lib/l10n.
  generate: true

  assets:
    - assets/audio/

  fonts:
    # Single variable-font file — one entry is enough (weight axis is inside).
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    # Arabic companion to Manrope. Manrope has no Arabic glyphs at all, so
    # before this the Arabic UI silently rendered in whatever the system font
    # happened to be, which clashed with the Latin half of every screen. Cairo
    # covers U+0600-06FF plus the presentation forms, and its geometric skeleton
    # sits close enough to Manrope that the two read as one family.
    # It is declared as a *fallback*, not a per-locale override, so mixed strings
    # (a localized prayer name next to a Latin "PM") pick the right face per
    # run instead of per widget.
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf

# Android launcher icon (generated with `dart run flutter_launcher_icons`).
# Android-only by design; iOS/macOS/web icons are intentionally disabled.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/icon_e_mihrab_512.png"
  adaptive_icon_background: "#096444"
  adaptive_icon_foreground: "assets/icons/icon_e_mihrab_512.png"
  min_sdk_android: 21
  remove_alpha_ios: true
