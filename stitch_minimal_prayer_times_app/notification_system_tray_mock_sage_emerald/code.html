<!-- Mobile Viewport Canvas Simulator -->
<div class="relative w-full max-w-[412px] h-[890px] rounded-[48px] overflow-hidden shadow-2xl flex flex-col justify-between border-[8px] border-surface-container-highest">
<!-- Atmospheric Ambient Background Wallpaper -->
<div class="absolute inset-0 bg-cover bg-center transition-all duration-700 filter brightness-95" data-alt="A tranquil, minimalist horizon landscape captured at the precise moment between twilight and sunset. Warm subtle terracotta and pale blush sky tones blend softly into cool calm slate mist over gentle rolling sand dunes. Shot in an architectural, serene aesthetic with soft diffuse lighting, gentle ambient glow, and an absolute absence of noise, offering pure stillness and visual equilibrium." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAUDpQKbBt194OEvrbKWkqhAd3tSQ2U-zUY_3L0Dh6KixqgIKpRTFsFfl-lTPaj14vzH8pHeWVV-jX8fzGnPCrBMziDzOjY9Rwp_AzJt-Jfidfpreo2JMiD5VxV6c6nZ5WFK7DjgVxRkZi8ikC8maiZJB5jNho-uLjVxVVbr8dKsYRcx-7TvtoWzYGJvovEmTjOd4HcpFlcOgyG9OMjZBZwcc1g7jhfHW6W5FUs3EIYSxgzfgxoyYuUeA')">
</div>
<!-- Soft Ambient Overlay for Readability -->
<div class="absolute inset-0 bg-surface/30 backdrop-blur-[40px] pointer-events-none"></div>
<div class="absolute inset-0 bg-gradient-to-b from-surface/70 via-surface/20 to-surface/80 pointer-events-none"></div>
<!-- Content Stack inside Phone Shell -->
<div class="relative z-10 flex flex-col h-full justify-between p-5">
<!-- Top Zone: Status Bar & Lockscreen Clock -->
<div class="flex flex-col items-center w-full pt-1">
<!-- Status Bar -->
<div class="w-full flex items-center justify-between px-3 text-on-surface">
<!-- Time -->
<span class="font-title-md text-title-md tracking-tight font-semibold">6:05</span>
<!-- Dynamic Island / Speaker Pill cutout hint -->
<div class="w-20 h-4 bg-inverse-surface/10 rounded-full backdrop-blur-sm"></div>
<!-- Indicators Cluster -->
<div class="flex items-center gap-1.5 text-on-surface">
<span class="font-label-sm text-label-sm font-semibold tracking-wider">5G</span>
<span class="material-symbols-outlined text-[18px] leading-none" data-icon="signal_cellular_alt">signal_cellular_alt</span>
<span class="material-symbols-outlined text-[20px] leading-none" data-icon="battery_full" data-weight="fill" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- Lockscreen Clock & Date -->
<div class="flex flex-col items-center mt-12 text-center">
<div class="flex items-center gap-1.5 text-secondary mb-1">
<span class="material-symbols-outlined text-[16px]" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-md text-label-md tracking-wide font-medium">Thursday, October 24</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface font-semibold tracking-tight text-center leading-none mt-1">
            6:05
          </h1>
<div class="flex items-center gap-2 mt-2 px-3 py-1 rounded-full bg-surface-container-low/70 backdrop-blur-md border border-outline-variant/30">
<span class="w-1.5 h-1.5 rounded-full bg-[#2E7D5B]"></span>
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest font-semibold">Riyadh • Umm al-Qura</span>
</div>
</div>
</div>
<!-- Mid-Low Zone: Modern System Notification Tray -->
<div class="w-full flex flex-col gap-3 my-auto pt-6">
<!-- Waqt Glassmorphism Notification Banner -->
<div class="group relative w-full bg-surface-container-lowest/80 backdrop-blur-xl rounded-[28px] p-4 shadow-[0_12px_32px_-6px_rgba(27,27,31,0.08)] border border-white/60 transition-transform active:scale-[0.99] duration-200">
<!-- App Identification Bar -->
<div class="flex items-center justify-between mb-3">
<div class="flex items-center gap-2">
<!-- Waqt Ambient Icon Glyph -->
<div class="w-6 h-6 rounded-lg bg-[#2E7D5B] flex items-center justify-center text-white shadow-sm">
<span class="material-symbols-outlined text-[14px]" data-icon="schedule" data-weight="fill" style="font-variation-settings: 'FILL' 1;">schedule</span>
</div>
<span class="font-label-sm text-label-sm tracking-wider font-bold text-on-surface uppercase">WAQT</span>
</div>
<div class="flex items-center gap-1 text-secondary">
<span class="font-label-sm text-label-sm">now</span>
</div>
</div>
<!-- Notification Narrative Body -->
<div class="flex items-start justify-between gap-3 px-0.5">
<div class="flex-1">
<div class="flex items-center gap-2 mb-1">
<h2 class="font-title-md text-title-md font-semibold text-on-surface tracking-tight">
                  Maghrib in 10 minutes
                </h2>
<span class="w-2 h-2 rounded-full bg-[#2E7D5B] animate-pulse"></span>
</div>
<p class="font-body-md text-body-md text-secondary">
                Prayer time is at 6:15 PM • Sunset at 6:14 PM
              </p>
</div>
<!-- Mini Solar/Prayer Horizon Micro-Glyph -->
<div class="w-10 h-10 rounded-full bg-[#b9efd0]/60 flex items-center justify-center shrink-0 border border-[#9dd2b5]/50 text-[#2E7D5B]">
<span class="material-symbols-outlined text-[20px]" data-icon="wb_twilight">wb_twilight</span>
</div>
</div>
<!-- Inline Subtle Progress Bar -->
<div class="mt-3.5 mb-3.5 w-full bg-[#b9efd0]/50 h-1.5 rounded-full overflow-hidden">
<div class="bg-[#2E7D5B] h-full rounded-full w-[85%] transition-all duration-1000"></div>
</div>
<!-- Quick Action Buttons Row -->
<div class="grid grid-cols-2 gap-2 pt-1 border-t border-outline-variant/20">
<button class="w-full py-2 px-3 rounded-full bg-surface-container/70 hover:bg-surface-container active:scale-95 transition-all text-on-surface-variant font-label-md text-label-md font-semibold flex items-center justify-center gap-1.5" type="button">
<span class="material-symbols-outlined text-[16px] text-secondary" data-icon="volume_off">volume_off</span>
<span>Mute this adhan</span>
</button>
<button class="w-full py-2 px-3 rounded-full bg-surface-container/70 hover:bg-surface-container active:scale-95 transition-all text-secondary font-label-md text-label-md font-semibold flex items-center justify-center gap-1.5" type="button">
<span class="material-symbols-outlined text-[16px] text-secondary" data-icon="close">close</span>
<span>Dismiss</span>
</button>
</div>
</div>
<!-- Ambient Secondary Reminder Note (Stacked Quiet Surface) -->
<div class="w-full bg-surface-container-low/50 backdrop-blur-md rounded-2xl px-4 py-2.5 flex items-center justify-between border border-white/40">
<div class="flex items-center gap-2.5">
<span class="material-symbols-outlined text-[18px] text-[#2E7D5B]" data-icon="wb_sunny">wb_sunny</span>
<span class="font-label-md text-label-md text-on-surface-variant">Sunrise tomorrow: 5:48 AM</span>
</div>
<span class="font-label-sm text-label-sm text-secondary">Fajr 4:32 AM</span>
</div>
</div>
<!-- Bottom Zone: Ambient Lockscreen Affordances -->
<div class="w-full pb-2">
<!-- Quick Action Circular Shortcuts -->
<div class="flex items-center justify-between px-2 mb-5">
<!-- Torch Toggle -->
<button aria-label="Flashlight" class="w-12 h-12 rounded-full bg-surface-container-highest/60 hover:bg-surface-container-highest/90 backdrop-blur-xl border border-white/40 flex items-center justify-center text-on-surface shadow-sm active:scale-90 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="flashlight_on">flashlight_on</span>
</button>
<!-- Notification Expand Cue -->
<div class="flex flex-col items-center gap-1 opacity-70">
<span class="material-symbols-outlined text-[16px] text-secondary" data-icon="keyboard_arrow_up">keyboard_arrow_up</span>
<span class="font-label-sm text-label-sm text-secondary font-medium tracking-wide">swipe up to unlock</span>
</div>
<!-- Camera Shortcut -->
<button aria-label="Camera" class="w-12 h-12 rounded-full bg-surface-container-highest/60 hover:bg-surface-container-highest/90 backdrop-blur-xl border border-white/40 flex items-center justify-center text-on-surface shadow-sm active:scale-90 transition-all" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="photo_camera">photo_camera</span>
</button>
</div>
<!-- Home Indicator Bar -->
<div class="w-32 h-1 bg-on-surface/30 rounded-full mx-auto"></div>
</div>
</div>
</div>
